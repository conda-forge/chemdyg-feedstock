{% set name = "chemdyg" %}
{% set version = "1.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/E3SM-Project/ChemDyg/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 323d6a449199de186e8a2255e79a9168cc6f6b0a48e3067a32b417c0fbe53f7b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - cartopy
    - jinja2
    - matplotlib-base
    - netcdf4
    - numpy
    - pandas
    - scipy
    - xarray
    - zppy >=3.0.0
test:
  imports:
    - chemdyg
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/E3SM-Project/ChemDyg
  summary: Chemistry Diagnostics Package
  description: |
    E3SM chemistry diagnostic package (ChemDyg) is designed for
    E3SM chemistry development, including plots and tables for model-to-model and model-to-observation comparison.

  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://github.com/E3SM-Project/ChemDyg
  dev_url: https://github.com/E3SM-Project/ChemDyg

extra:
  recipe-maintainers:
    - andrewdnolan
    - xylar
    - hsiangheleellnl
    - tangq
